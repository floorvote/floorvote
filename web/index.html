<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Stale-deploy recovery. A browser- or edge-cached index.html can reference a
      hashed bundle that a later deploy rotated away. Because Workers Assets uses
      not_found_handling=single-page-application, the missing /assets/*.js is
      answered with the HTML shell (200, text/html), so the browser refuses it
      ("Expected a JavaScript module but got text/html") and the app never mounts.
      Catch that failed asset load and reload once to fetch fresh HTML + current
      hashes. Guarded to at most one reload per 10s to prevent loops.
    -->
    <script>
      (function () {
        window.addEventListener(
          'error',
          function (event) {
            var el = event && event.target;
            if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
            var url = el.src || el.href || '';
            if (url.indexOf('/assets/') === -1) return;
            try {
              var KEY = 'fv:asset-reload-at';
              var now = Date.now();
              if (now - parseInt(sessionStorage.getItem(KEY) || '0', 10) < 10000) return;
              sessionStorage.setItem(KEY, String(now));
            } catch (e) {
              return; // no sessionStorage -> can't guard a loop, so don't reload
            }
            window.location.reload();
          },
          true // capture phase: resource load errors don't bubble
        );
      })();
    </script>
    <link rel="icon" href="/favicon-v3.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-v3-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-v3-16.png" />
    <meta name="robots" content="noindex, nofollow" />
    <title>%PRODUCT_NAME%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_reaction,arrow_forward,attach_file,autorenew,calendar_today,change_history,chat,check_box,circle,delete,description,edit,edit_note,event,flag,gavel,how_to_vote,info,keep,link_2,list,location_on,new_releases,notes,person_add,person_remove,playlist_add,restore_from_trash,schedule,sticky_note_2,thumbs_up_down" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: #f8fafc; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
button, select, input, textarea { font: inherit; }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
