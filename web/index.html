<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Stale-deploy recovery guard. Extracted to /reload-guard.js (a classic,
      external script) so the CSP can keep `script-src 'self'` strict — no inline
      script, no per-build hash to maintain. Must stay a blocking classic script
      in <head>, before the module bundle below, so its capture-phase 'error'
      listener is registered in time to catch a failed /assets/*.js load. See
      web/public/reload-guard.js for the full rationale.
    -->
    <script src="/reload-guard.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="robots" content="noindex, nofollow" />
    <title>%PRODUCT_NAME%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_reaction,arrow_forward,attach_file,autorenew,calendar_today,change_history,chat,check_box,circle,delete,description,edit,edit_note,event,flag,gavel,how_to_vote,info,keep,link_2,list,location_on,more_vert,new_releases,notes,person_add,person_remove,playlist_add,restore_from_trash,schedule,sticky_note_2,thumbs_up_down,warning" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: #f8fafc; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
button, select, input, textarea { font: inherit; }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
