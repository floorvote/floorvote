name: Claude

# Runs Claude Code when someone with write access asks for it: `@claude` in an
# issue, a comment, or a review, or the `claude` label on an issue. The action
# itself refuses anyone without write access, so outside contributors can't
# start a run. Runs bill to the subscription behind CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token`, valid for a year).
#
# `self-test` runs only on pull requests that change this file. It checks that
# the token still works and that Claude can read the repo, and posts one line.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]
  pull_request:
    paths: [.github/workflows/claude.yml]

jobs:
  claude:
    # Skip runners for everything that doesn't ask for Claude.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          additional_permissions: |
            actions: read
          claude_args: --max-turns 60

  self-test:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            This is a smoke test of the Claude workflow. Read AGENTS.md, then post
            exactly one comment on pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }} with `gh pr comment`. The comment is one line:
            "Claude workflow self-test: token works; AGENTS.md has N top-level sections.",
            with N filled in. Change nothing else.
          claude_args: --max-turns 8 --allowedTools "Read,Bash(gh pr comment:*)"
