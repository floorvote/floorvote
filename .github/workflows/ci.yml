name: CI

# Runs on every pull request and every push to main. The package jobs below
# are conditional on what the change touches (see `changes`); the cheap jobs
# always run.
#
# Why no `paths-ignore` here: the `main` ruleset requires secret-scan,
# check-api, check-central, check-web and check-scripts. A workflow that path
# filtering skips never reports those contexts, and an unreported required
# check blocks the merge just as a failing one does — which is what the old
# ci-docs.yml worked around by declaring echo jobs of the same names over the
# complementary paths. A JOB skipped by its `if:` is different: GitHub reports
# it as Success, so a docs-only PR gets its required contexts from this one
# workflow with nothing to keep in sync.
on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress CI when a new push arrives on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which packages this change touches. On a pull request the filters compare
  # against the base branch, so a PR in a stack sees only its own commits. On a
  # push to main every output is true: main runs everything, as the safety net
  # for PRs that were tested against an older main (the ruleset's required
  # checks are not strict).
  #
  # Each package's inputs are its own tree, shared/ (imported by api, web and
  # central), and the root manifest + lockfile that install every job's
  # toolchain. A change to this file reruns everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'push' || steps.filter.outputs.api == 'true' }}
      central: ${{ github.event_name == 'push' || steps.filter.outputs.central == 'true' }}
      web: ${{ github.event_name == 'push' || steps.filter.outputs.web == 'true' }}
    steps:
      # Reads the PR's changed files through the API: no checkout needed. On a
      # push there is no PR to diff, and the outputs above are true regardless.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            common: &common
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            api:
              - *common
              - 'api/**'
            central:
              - *common
              - 'central/**'
            web:
              - *common
              - 'web/**'

  # Secret scanning. Runs the gitleaks BINARY (MIT, free) rather
  # than gitleaks-action, which requires a paid GITLEAKS_LICENSE for ORG repos.
  # Pinned to a specific release + sha256-verified. Config + allowlist: .gitleaks.toml.
  # Always runs: a secret can land in any file, prose included.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks scans all commits, not just HEAD
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # linux_x64 tarball, from the v8.30.1 checksums file
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

  # api and central are independent packages with independent test suites, so
  # they run as parallel jobs — the critical path is max(api, central), not the
  # sum. Each job repeats the root `npm ci` (its only shared cost), which also
  # provides the eslint + @typescript-eslint toolchain that central's lint/tsc
  # resolve against.
  #
  # api's suite is the longest step in the run, so it is split: tsc and lint in
  # one job, the tests in three shards (`vitest --shard` distributes files
  # across them), and `check-api` as the fan-in that carries the required
  # context name. The repository is public, so the extra runners are free; the
  # split costs only the repeated 30-second setup.
  check-api-static:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.build.json
        working-directory: api
      - run: npm run lint
        working-directory: api

  check-api-tests:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: check-api-tests (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3
        working-directory: api

  # The required context. Passes when every api job passed, or when all were
  # skipped because the change does not touch api (a skipped job reports
  # Success, but a fan-in that `needs` skipped jobs would itself be skipped
  # without `always()`, and must then decide for itself). A failed `changes`
  # job skips everything downstream too, which must not read as green.
  check-api:
    needs: [changes, check-api-static, check-api-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.check-api-static.result }}
          TESTS: ${{ needs.check-api-tests.result }}
        run: |
          echo "changes=$CHANGES static=$STATIC tests=$TESTS"
          [ "$CHANGES" = success ] || { echo "::error::the changes job did not succeed"; exit 1; }
          case "$STATIC/$TESTS" in
            success/success|skipped/skipped) exit 0 ;;
            *) echo "::error::an api job failed or was cancelled"; exit 1 ;;
          esac

  check-central:
    needs: changes
    if: needs.changes.outputs.central == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # Root install for the shared eslint/tsc toolchain; central's own runtime
      # deps (separate package, not a root workspace) are installed below.
      - run: npm ci
      - run: npm ci
        working-directory: central
      - run: npx tsc --noEmit -p tsconfig.build.json
        working-directory: central
      - run: npm run lint
        working-directory: central
      - run: npm test
        working-directory: central
      # central's dashboard SPA is a third package with its own lockfile.
      # `npm ci` here is what catches a lockfile that no longer matches its
      # package.json, which otherwise surfaces only as a dirty tree mid-deploy.
      - run: npm ci
        working-directory: central/web
      - run: npm run build
        working-directory: central/web
      - run: npm test
        working-directory: central/web

  # web is split the same way: tsc, lint and build in one job, the jsdom
  # suite in two shards, and `check-web` as the fan-in.
  check-web-static:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  check-web-tests:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: check-web-tests (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/2
        working-directory: web

  check-web:
    needs: [changes, check-web-static, check-web-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.check-web-static.result }}
          TESTS: ${{ needs.check-web-tests.result }}
        run: |
          echo "changes=$CHANGES static=$STATIC tests=$TESTS"
          [ "$CHANGES" = success ] || { echo "::error::the changes job did not succeed"; exit 1; }
          case "$STATIC/$TESTS" in
            success/success|skipped/skipped) exit 0 ;;
            *) echo "::error::a web job failed or was cancelled"; exit 1 ;;
          esac

  # The repo-tooling suite (scripts/lib): bill-statement builders, the seeder's
  # D1 helpers, and the drift guards. It had no CI job, so 71 tests could rot
  # unnoticed — the seeder's SQL builders are covered here and nowhere else.
  # Invoked per-package like the jobs above rather than through the root
  # vitest.config.ts, so it doesn't depend on central's separately-installed
  # dependencies.
  #
  # Always runs: it is under a minute, and its inputs reach across the repo —
  # the docs link tests read docs/, the CODEOWNERS and provider tests read
  # central/src/providers, and verify:timestamps reads api/src and central/src.
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vitest run
        working-directory: scripts
      # Stored-timestamp guard over api/src + central/src (docs/internal/dates.md).
      - run: npm run verify:timestamps

  # Under a minute; not worth a filter.
  check-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: root
      - run: npx vitest run
        working-directory: root
