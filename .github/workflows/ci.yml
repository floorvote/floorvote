name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'research/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'research/**'
      - '**/*.md'

# Cancel in-progress CI when a new push arrives on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secret scanning. Runs the gitleaks BINARY (MIT, free) rather
  # than gitleaks-action, which requires a paid GITLEAKS_LICENSE for ORG repos.
  # Pinned to a specific release + sha256-verified. Config + allowlist: .gitleaks.toml.
  # Operator: make this a REQUIRED status check via branch protection once the
  # first run is reviewed (see docs/security-ci.md).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks scans all commits, not just HEAD
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # linux_x64 tarball, from the v8.30.1 checksums file
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

  # api and central are independent packages with independent test suites, so
  # they run as parallel jobs — the critical path is max(api, central), not the
  # sum. Each job repeats the root `npm ci` (its only shared cost), which also
  # provides the eslint + @typescript-eslint toolchain that central's lint/tsc
  # resolve against.
  check-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Timestamp-write guard
        run: npx tsx scripts/verify-timestamp-writes.ts
      - run: npx tsc --noEmit -p tsconfig.build.json
        working-directory: api
      - run: npm run lint
        working-directory: api
      - run: npm test
        working-directory: api

  check-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      # Root install for the shared eslint/tsc toolchain; central's own runtime
      # deps (separate package, not a root workspace) are installed below.
      - run: npm ci
      - run: npm ci
        working-directory: central
      - run: npx tsc --noEmit -p tsconfig.build.json
        working-directory: central
      - run: npm run lint
        working-directory: central
      - run: npm test
        working-directory: central

  check-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  # The repo-tooling suite (scripts/lib): bill-statement builders, the seeder's
  # D1 helpers, and the drift guards. It had no CI job, so 71 tests could rot
  # unnoticed — the seeder's SQL builders are covered here and nowhere else.
  # Invoked per-package like the jobs above rather than through the root
  # vitest.config.ts, so it doesn't depend on central's separately-installed
  # dependencies.
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vitest run
        working-directory: scripts

  check-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: root
      - run: npx vitest run
        working-directory: root
