# api/wrangler.example.toml — example single-tenant configuration.
# Copy to api/wrangler.toml, add your [env.<slug>] block, and deploy:
#   npm run deploy:tenant -- <slug>
#
# wrangler never auto-discovers *.example.toml — this file is pure documentation.

# ── Shared top-level config (inherited by all envs) ──────────────────────────
name = "floorvote-api"
main = "src/index.ts"
compatibility_date = "2026-06-18"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[define]
BUILD_SHA = "'dev'"

[build]
[build.alias]
"@google/genai" = "../node_modules/@google/genai/dist/web/index.mjs"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# With not_found_handling = "single-page-application" and a compatibility_date of
# 2025-04-01 or later, browser *navigations* to a path with no matching asset are
# served index.html (the SPA) BEFORE the Worker runs — so opening an /api/* URL in
# a new tab renders the app shell instead of hitting the API (client-side fetch()
# still reaches the Worker). run_worker_first forces the Worker to run first for
# API paths, so direct navigations (e.g. bill-text "Open in new tab") work.
run_worker_first = ["/api/*"]

# ── Local dev env ────────────────────────────────────────────────────────────
[env.dev]
name = "floorvote-dev"

# [define] is non-inheritable: wrangler does NOT apply the top-level [define]
# to named environments, so each env needs its own or wrangler warns on every
# command. BUILD_SHA is overridden at deploy via --define; "'dev'" is a placeholder.
[env.dev.define]
BUILD_SHA = "'dev'"

[env.dev.vars]
APP_URL = "http://localhost:5173"
ASSOCIATION_NAME = "Dev Association"
STATE = "NJ"
TENANT_ID = "dev"
CENTRAL_API_URL = "http://localhost:8788"
PROVIDER = "legiscan"
# AI_GATEWAY_ENABLED = "true"
# CF_ACCOUNT_ID = "REPLACE_WITH_ACCOUNT_ID"
# CF_AIG_GATEWAY = "your-gateway-slug"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "floorvote-dev"
database_id = "REPLACE_WITH_DEV_DB_ID"
migrations_dir = "migrations"

[[env.dev.queues.producers]]
binding = "BILL_QUEUE"
queue = "floorvote-dev-queue"

[[env.dev.queues.consumers]]
queue = "floorvote-dev-queue"
max_batch_size = 10
max_batch_timeout = 30

[[env.dev.send_email]]
name = "EMAIL"

[[env.dev.ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "2099"
  [env.dev.ratelimits.simple]
  limit = 10
  period = 60

# ── Example production tenant ────────────────────────────────────────────────
# Copy this block, replace "example" with your org slug, and fill in IDs.

[env.example]
name = "floorvote-example"
routes = [{ pattern = "app.example.com", custom_domain = true }]

# [define] is non-inheritable: wrangler does NOT apply the top-level [define]
# to named environments, so each env needs its own or wrangler warns on every
# command. BUILD_SHA is overridden at deploy via --define; "'dev'" is a placeholder.
[env.example.define]
BUILD_SHA = "'dev'"

[env.example.vars]
APP_URL = "https://app.example.com"
TENANT_ID = "example"
CENTRAL_API_URL = "https://your-central.your-subdomain.workers.dev"
PROVIDER = "legiscan"                            # "legiscan" or "openstates"
STATE = "NJ"                                      # 2-letter state; "" for multi-state
APP_DOMAINS = "example.com"
EMAIL_FROM = "notifications@example.com"
EMAIL_PROVIDER = "cloudflare"                     # "cloudflare" or "resend"
# EMAIL_FROM_BULK = "notifications@mail.example.com"  # optional: dedicated sending subdomain for bulk mail (digest, week-ahead) to segment reputation from login mail. Verify the subdomain as its own Email Sending domain first. Falls back to EMAIL_FROM when unset.
SUPERADMIN_JWT_PUBLIC_KEY = "{...ES256 public JWK JSON...}"
# OPERATOR_NAME = "Your Org"
# OPERATOR_URL = "https://yourorg.example.com"
# OPERATOR_CONTACT_EMAILS = "feedback@example.com"
# AI_GATEWAY_ENABLED = "true"
# CF_ACCOUNT_ID = "REPLACE_WITH_ACCOUNT_ID"
# CF_AIG_GATEWAY = "your-gateway-slug"
# ALERT_EMAILS = "ops@example.com"
# DEMO_MODE = "true"                              # optional: make this tenant a public demo (auto-login, no email, additive writes only, reset every six hours via a 0 0,6,12,18 * * * cron in the per-tenant api/wrangler.toml — operator-only, not in this repo). Leave INSTANCE_PRESET unset when set.
# DEMO_SEED = "nj-county-clerks"                  # which demo seed supplies the content — a key in api/src/lib/demoSeeds/index.ts. Defaults to "nj-county-clerks" when unset.

[[env.example.d1_databases]]
binding = "DB"
database_name = "floorvote-example"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.example.queues.producers]]
binding = "BILL_QUEUE"
queue = "floorvote-example-queue"

[[env.example.queues.consumers]]
queue = "floorvote-example-queue"
max_batch_size = 10
max_batch_timeout = 30

[[env.example.services]]
binding = "CENTRAL"
service = "floorvote-central"       # or your central worker name
entrypoint = "TenantApi"
# Object-level authorization (defense-in-depth). Central's TenantApi reads this
# as `ctx.props.tenantId` — a per-binding value Cloudflare sets at deploy time
# and guarantees is authentic/unforgeable — and rejects any tenant-scoped call
# (e.g. /api/tenants/reprocess/:id, /api/tenants/register) that targets a
# DIFFERENT tenant. It MUST equal this environment's TENANT_ID var above. Omit it
# and central falls back to lenient mode for this tenant (the allowlist still
# applies); set it to close the cross-tenant gap.
props = { tenantId = "example" }    # MUST match [env.example.vars] TENANT_ID

[[env.example.send_email]]
name = "EMAIL"

[[env.example.ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "3001"               # unique per env
  [env.example.ratelimits.simple]
  limit = 10
  period = 60

# Secrets (set via `wrangler secret put --env example`):
# RESEND_API_KEY           — magic-link email (if EMAIL_PROVIDER=resend)
# GEMINI_API_KEY           — Google Gemini AI (fallback when AI_GATEWAY_ENABLED != true)
# CF_AIG_TOKEN             — Cloudflare AI Gateway auth token (when AI_GATEWAY_ENABLED=true)
# CENTRAL_ADMIN_SECRET     — required until migrated to CentralApi RPC binding
